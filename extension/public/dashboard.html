<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job-AI</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="topnav">
    <div class="topnav-brand"><span class="tn-badge"></span><span class="tn-name">Job-AI</span></div>
    <ul id="nav" class="topnav-tabs">
      <li data-view="dashboard" class="tab active">Dashboard</li>
      <li data-view="tracker" class="tab">Tracker</li>
      <li data-view="activity" class="tab">Activity</li>
    </ul>
    <div class="topnav-right">
      <div class="setup-menu" id="setup-menu">
        <button class="setup-label" id="setup-label">Setup <span class="setup-chev">&#9662;</span></button>
        <div class="setup-pop" id="setup-pop">
          <div class="setup-h">Set up once</div>
          <ul id="nav-setup">
            <li data-view="personal" class="setup-item"><span class="nav-num">1</span>Personal Details</li>
            <li data-view="cvs" class="setup-item"><span class="nav-num">2</span>CVs</li>
            <li data-view="search" class="setup-item"><span class="nav-num">3</span>Search Preferences</li>
            <li data-view="license" class="setup-item"><span class="nav-num">4</span>License</li>
            <li data-view="trac-details" class="setup-item"><span class="nav-num">5</span>NHS / Trac details</li>
          </ul>
        </div>
      </div>
      <span class="tn-chip" id="tn-status">Your data stays on this device</span>
      <button class="tn-help" id="tn-help" title="Take the tour">?</button>
    </div>
  </header>
  <main id="content"></main>
  <footer class="app-footer">Job-AI · Apply to jobs while you sleep</footer>

  <button id="asst-fab" title="Ask Job-AI" aria-label="Ask Job-AI">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Ask Job-AI</span>
  </button>
  <div id="asst-panel" aria-hidden="true">
    <div class="asst-head">
      <div class="asst-title"><span class="asst-dot"></span> Job-AI Assistant</div>
      <button id="asst-close" title="Close" aria-label="Close">&times;</button>
    </div>
    <div id="asst-log" class="asst-log"></div>
    <form id="asst-form" class="asst-form" autocomplete="off">
      <input id="asst-input" type="text" placeholder="Ask about your agents, settings, or a skip…" maxlength="2000" />
      <button id="asst-send" type="submit" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>
  </div>

  <script src="errors.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
