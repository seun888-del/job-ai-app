name: Android spike

on:
  push:
    branches: [android-spike]
    paths: ['android-spike/**', '.github/workflows/android-spike.yml']
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build test app
        working-directory: android-spike
        run: gradle assembleDebug --no-daemon -q
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android-spike/run-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-logs
          path: spike-out/
