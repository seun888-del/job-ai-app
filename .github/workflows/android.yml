name: Android app

on:
  push:
    branches: [android-app]
    paths: ['android/**', 'extension/**', 'bot/modules/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install build tools
        run: npm ci --ignore-scripts
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1', PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - name: Build dashboard for Android
        run: node extension/build.mjs --android --test
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build app
        working-directory: android
        run: gradle assembleDebug --no-daemon -q
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/test/run-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            android-out/
            android/app/build/outputs/apk/debug/app-debug.apk
