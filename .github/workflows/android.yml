name: Android app

on:
  push:
    branches: [android-app]
    paths: ['android/**', 'extension/**', 'bot/modules/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install build tools
        run: npm ci --ignore-scripts
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1', PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - name: Build dashboard for Android
        run: node extension/build.mjs --android --test
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build app
        working-directory: android
        run: gradle assembleDebug --no-daemon -q
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Test licence (repo secret). Agents run with the safety switch on: nothing is ever sent.
          JOBAI_TEST_LICENSE: ${{ secrets.JOBAI_TEST_LICENSE }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/test/run-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            android-out/
            android/app/build/outputs/apk/debug/app-debug.apk

  # Installable build for testers + Play: no test hook, signed with the upload key.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install build tools
        run: npm ci --ignore-scripts
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1', PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - name: Build dashboard for Android (release)
        run: node extension/build.mjs --android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build signed APK + AAB
        working-directory: android
        env:
          JOBAI_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          JOBAI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JOBAI_VERSION_CODE: ${{ github.run_number }}
          JOBAI_VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          echo "$JOBAI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export JOBAI_KEYSTORE="$RUNNER_TEMP/upload.jks"
          gradle assembleRelease bundleRelease --no-daemon -q
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Job-AI-android-0.1.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/Job-AI-android-0.1.${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/out/

